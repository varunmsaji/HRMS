# Production Nginx main config (RELEASE_HARDENING_PHASE_3B §5/§6). Site-specific routing lives in
# conf.d/hrms.conf.template (rendered from the domains in this stack's .env — see
# docker-compose.prod.yml's `nginx` service `command`).

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # LOG-04 — onboarding, account-invite, password-reset and email-verification links carry a
    # bearer token as a path segment. `$request_uri` logged it verbatim (plus the query string,
    # which on the storage vhost is a presigned URL's signature). The access log now records
    # `$hrms_log_uri`: the normalized path with that segment masked and no query string. The
    # prefixes mirror `apps/api/src/hrms/core/observability/redaction.py::TOKEN_PATH_PREFIXES` —
    # keep the two in sync.
    map $uri $hrms_log_uri {
        "~^(?<hrms_prefix>/v1/public/(?:onboarding|account-invites)/|/(?:onboarding|verify-email|reset-password|accept-invite)/)[^/]+(?<hrms_rest>.*)$" "${hrms_prefix}[REDACTED]${hrms_rest}";
        default $uri;
    }

    # LOG-01 — one correlation id from the edge to the API. A client-sent `X-Request-Id` is
    # forwarded as-is (the API validates it and substitutes its own UUID when it is malformed or
    # over 64 characters); when absent, Nginx's own 32-hex `$request_id` is used, so the edge log
    # line and every API/worker log line for the request share an id.
    map $http_x_request_id $hrms_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # JSON access log — consistent with the API/worker's own structlog JSON lines (STEP 10), so a
    # single log pipeline/aggregator can parse both without two different formats.
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$hrms_request_id",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$hrms_log_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"host":"$host",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Onboarding document upload ceiling is 10 MiB, plus the app layer's own 2 MiB multipart
    # headroom (apps/api/src/hrms/app.py's `MaxUploadSizeMiddleware`) — 15m here leaves margin
    # above that combined ceiling rather than matching it exactly, so Nginx is never the tighter
    # of the two limits.
    client_max_body_size 15m;

    # Real client IP / scheme are forwarded to the API and web containers from conf.d/hrms.conf
    # via X-Forwarded-For/X-Forwarded-Proto — OPS-02's `TRUSTED_PROXY_HOSTS` on the API side must
    # list this Nginx container's Docker-network address/subnet for `ProxyHeadersMiddleware` to
    # actually trust those headers (see docs/deployment/PRODUCTION_DEPLOYMENT.md).

    include /etc/nginx/conf.d/*.conf;
}
