# VPS variant of docker-compose.prod.yml for a host that already runs its own nginx on 80/443
# (the shared Hostinger VPS). No nginx/certbot containers: the HOST nginx terminates TLS and proxies
# to the loopback ports published below. Same project name/network/volume names as prod, none of
# which collide with the other app on this host.
# Production stack for the self-hosted Hostinger VPS — Docker + Nginx + Let's Encrypt, no AWS
# (RELEASE_HARDENING_PHASE_3B). See docs/deployment/PRODUCTION_DEPLOYMENT.md for setup.
#
# Two docker networks, not one, so a compromised/misconfigured Nginx has no route to Postgres or
# Redis at all: `data` (postgres, redis, minio, api, worker, beat) and `edge` (nginx, api, web,
# minio). MinIO sits on both — Nginx must reach it directly to proxy `S3_PUBLIC_ENDPOINT_URL`
# (presigned document URLs handed to the browser), but Postgres/Redis have no reason to ever be
# reachable from the edge segment. Nothing in this file publishes a `ports:` mapping for
# postgres/redis/minio — that, not the network split alone, is what actually keeps them off the
# public internet; the network split is defense-in-depth on top of it.
#
# Two env files, deliberately not merged: this file's own `.env` (copy from `.env.prod.example`,
# repo root) drives Postgres/MinIO container credentials and Nginx/Compose-level values; each
# apps/api process additionally loads `apps/api/env/.env.production` (copy from
# `apps/api/env/.env.production.example`) for the full application `Settings`. The Postgres/MinIO
# credentials must match between the two — see the runbook.

name: hrms-prod

# Shared by compreface-admin and compreface-api. COMPREFACE_POSTGRES_PASSWORD goes in this file's
# `.env`; it is only needed with the `compreface` profile (CompreFace's Postgres refuses to start
# without it).
x-compreface-db-env: &compreface-db-env
  POSTGRES_USER: compreface
  POSTGRES_PASSWORD: ${COMPREFACE_POSTGRES_PASSWORD:-}
  POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
  SPRING_PROFILES_ACTIVE: dev
  MAX_FILE_SIZE: 5MB
  MAX_REQUEST_SIZE: 10MB

x-logging: &default-logging
  # STEP 10/11 — bounds each container's own log volume so Docker's default json-file driver
  # (unbounded by default) cannot fill the VPS disk on its own; see docs/deployment/
  # PRODUCTION_DEPLOYMENT.md's disk-monitoring section for the rest of the disk budget.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  data:
  edge:
  # CompreFace only (profile `compreface`): its containers plus api and worker, which call it
  # (worker carries out queued face deletions). No route from edge, nothing published publicly.
  face:

volumes:
  postgres_data:
  compreface_data:
  redis_data:
  minio_data:
  # Per-module application log files, shared by api, worker and beat (multi-process-safe
  # appends and rotation — see docs/operations/LOGGING_GUIDE.md).
  api_logs:
  # Multi-process Prometheus metric files, shared by api, worker and beat so /metrics reports the
  # whole system. Counters only; safe to wipe on a full redeploy (docs/operations/
  # OBSERVABILITY_RUNBOOK.md). Grows by ~64 KB per process ever started - negligible.
  metrics_mp:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      # Provisions the application's own runtime role (infra/docker/postgres/init/002_app_role.sh)
      # — deliberately no default here (RELEASE_HARDENING_PHASE_6A / Finding DB-01): a missing
      # value must fail the stack closed, not silently fall back to a repo-visible password. Must
      # match the password segment of apps/api/env/.env.production's DATABASE_URL — see the
      # runbook.
      HRMS_APP_PASSWORD: ${HRMS_APP_PASSWORD:?HRMS_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters and Celery broker/result state survive a container restart with this;
    # none of it is data that would be catastrophic to lose, but losing an in-flight Celery task
    # on every routine redeploy is an avoidable annoyance.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio:
    ports:
      - "127.0.0.1:9100:9000"
    # minio/minio is archived upstream and no longer pullable (MinIO Inc. ended open-source
    # distribution — see docs/devops/MINIO_IMAGE_REPLACEMENT_AUDIT.md). pgsty/silo is a
    # drop-in-compatible fork, verified in that audit: same env vars, same on-disk data format,
    # real integration-test suite passing against it, 41/41. Pinned by digest (not `latest`,
    # per the audit's versioning policy) since this is production and we don't control the fork.
    image: pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 # RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks: [data, edge]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  minio-init:
    image: pgsty/mc@sha256:8ac3333f012adb27c406df77c7cae6ce700892cc44ee489036404e3fc356e9ea # RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    networks: [data]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_DOCUMENTS} &&
      mc anonymous set none local/$${MINIO_BUCKET_DOCUMENTS}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_DOCUMENTS: ${MINIO_BUCKET_DOCUMENTS:?MINIO_BUCKET_DOCUMENTS is required}
    restart: "no"
    logging: *default-logging

  api:
    ports:
      - "127.0.0.1:8001:8000"
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        FACE_OS_ASSETS: "true"
    image: hrms-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - apps/api/env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - metrics_mp:/app/metrics
    environment:
      PROMETHEUS_MULTIPROC_DIR: /app/metrics
    networks: [data, edge, face]
    logging: *default-logging
    # HEALTHCHECK is inherited from the image (apps/api/Dockerfile) — liveness only, deliberately
    # (STEP 7): a Postgres/Redis blip must not make Docker restart an otherwise-healthy API
    # process. Nginx/an external monitor should poll `/health/ready` instead for routing
    # decisions, not this container healthcheck.

  # One-off migration runner — `docker compose -f docker-compose.prod.yml run --rm migrate`.
  # Deliberately NOT part of the default `up` (profiles: tools keeps it out of `docker compose
  # up`'s service set): migrations must run once, explicitly, before the new `api`/`worker`/`beat`
  # containers take traffic, per the deployment runbook — never automatically on every container
  # start, which would race if `api` and `worker` started concurrently.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: hrms-api:${IMAGE_TAG:-latest}
    env_file:
      - apps/api/env/.env.production
    command: ["sh", "-c", "exec alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    profiles: ["tools"]
    logging: *default-logging

  worker:
    image: hrms-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - apps/api/env/.env.production
    command: ["sh", "-c", "exec celery -A entrypoints.worker worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - metrics_mp:/app/metrics
    environment:
      PROMETHEUS_MULTIPROC_DIR: /app/metrics
    networks: [data, face]
    # Overrides the image's inherited HEALTHCHECK (an HTTP GET on :8000 — this container runs
    # Celery, not the API's HTTP server, so that check would fail permanently). `inspect ping`
    # only proves *some* worker answers on the broker — correct for today's single-replica
    # deployment; scaling to multiple `worker` replicas would need `-d celery@$$HOSTNAME` to
    # target this specific instance instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A entrypoints.worker inspect ping --timeout 10 | grep -q OK"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3
    logging: *default-logging

  # `celery beat` must run as exactly one instance (two schedulers would double-fire every
  # scheduled task — leave accrual, comp-off sweeps, attendance calculation, all of which are
  # idempotent per-run but not meant to run twice concurrently). Never scale this service.
  beat:
    image: hrms-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - apps/api/env/.env.production
    # `--schedule` must point somewhere the non-root `hrms` user (apps/api/Dockerfile) can write —
    # `/app` itself is root-owned (created by `WORKDIR` before the chowned `COPY`), so celery
    # beat's default `celerybeat-schedule` (written to argv[0]'s cwd) fails with `PermissionError`
    # and crash-loops. Found by actually running this container, not by inspection — see
    # RELEASE_HARDENING_PHASE_3B_PRODUCTION_INFRASTRUCTURE.md. `/tmp` is safe to lose on restart:
    # this file only caches *when* each schedule entry last ran to avoid a double-fire on beat's
    # own restart within the same tick; losing it worst-case reruns one already-idempotent task.
    command: ["sh", "-c", "exec celery -A entrypoints.worker beat --loglevel=info --schedule=/tmp/celerybeat-schedule"]
    # No built-in Celery healthcheck exists for `beat` (unlike `worker`'s `inspect ping`), and the
    # image's own inherited HTTP-based HEALTHCHECK (see `worker`'s override above) is equally
    # inapplicable here. Disabled rather than left silently wrong; `restart: unless-stopped`
    # already recovers a crashed process regardless of healthcheck status.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - metrics_mp:/app/metrics
    environment:
      PROMETHEUS_MULTIPROC_DIR: /app/metrics
    networks: [data]
    logging: *default-logging

  web:
    ports:
      - "127.0.0.1:3001:3000"
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    image: hrms-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [edge]
    logging: *default-logging

  # CompreFace (self-hosted face recognition; docs/operations/COMPREFACE_FACE_PROVIDER_SETUP.md).
  # Opt-in: `docker compose -f docker-compose.vps.yml --profile compreface up -d`. The API reaches
  # it at COMPREFACE_BASE_URL=http://compreface-api:8080 over the `face` network. The admin UI is
  # on 127.0.0.1:8091 only, for an SSH tunnel. Budget about 2-3 GB RAM, mostly compreface-core.
  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0
    profiles: [compreface]
    restart: unless-stopped
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: ${COMPREFACE_POSTGRES_PASSWORD:-}
      POSTGRES_DB: frs
    volumes:
      - compreface_data:/var/lib/postgresql/data
    networks: [face]
    logging: *default-logging

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    profiles: [compreface]
    restart: unless-stopped
    environment:
      <<: *compreface-db-env
      ENABLE_EMAIL_SERVER: "false"
      ADMIN_JAVA_OPTS: -Xmx512m
    depends_on: [compreface-postgres-db, compreface-api]
    networks: [face]
    logging: *default-logging

  compreface-api:
    image: exadel/compreface-api:1.2.0
    profiles: [compreface]
    restart: unless-stopped
    environment:
      <<: *compreface-db-env
      API_JAVA_OPTS: -Xmx1g
      # Embeddings only: no employee photo is kept by CompreFace.
      SAVE_IMAGES_TO_DB: "false"
      CONNECTION_TIMEOUT: "10000"
      READ_TIMEOUT: "60000"
    depends_on: [compreface-postgres-db]
    networks: [face]
    logging: *default-logging

  compreface-core:
    image: exadel/compreface-core:1.2.0
    profiles: [compreface]
    restart: unless-stopped
    environment:
      ML_PORT: "3000"
      IMG_LENGTH_LIMIT: "640"
      UWSGI_PROCESSES: "2"
      UWSGI_THREADS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [face]
    logging: *default-logging

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    profiles: [compreface]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    environment:
      CLIENT_MAX_BODY_SIZE: 10M
      PROXY_READ_TIMEOUT: 60000ms
      PROXY_CONNECT_TIMEOUT: 10000ms
    depends_on: [compreface-api, compreface-admin]
    networks: [face]
    logging: *default-logging
