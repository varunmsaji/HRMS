<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 204" width="880" height="408" role="img" aria-label="Animated diagram connecting Profiles, Attendance, Leave, and Payroll Prep into the central Krewoxa HR Hub">
  <defs>
    <style>
      svg { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: radial-gradient(circle at 50% 50%, #DBEAFE 0%, #EFF6FF 48%, #FFFFFF 100%); }
      @keyframes kDashFlow { to { stroke-dashoffset: -28; } }
      @keyframes kHubRipple { 0% { transform: scale(0.88); opacity: 0.75; } 70%, 100% { transform: scale(1.42); opacity: 0; } }
      @keyframes kNodeBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
      @keyframes kNodeGlow { 0%, 100% { stroke: #BFDBFE; } 50% { stroke: #3B82F6; } }
      .k-flow-line { stroke-dasharray: 6 8; animation: kDashFlow 1.3s linear infinite; }
      .k-flow-line-rev { stroke-dasharray: 6 8; animation: kDashFlow 1.3s linear infinite reverse; }
      .k-hub-ring { transform-origin: 220px 102px; animation: kHubRipple 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .k-hub-ring-2 { transform-origin: 220px 102px; animation: kHubRipple 2.8s cubic-bezier(0.16, 1, 0.3, 1) 1.4s infinite; }
      .k-node-1 { animation: kNodeBob 3.6s ease-in-out infinite; }
      .k-node-2 { animation: kNodeBob 3.6s ease-in-out 0.9s infinite; }
      .k-node-3 { animation: kNodeBob 3.6s ease-in-out 1.8s infinite; }
      .k-node-4 { animation: kNodeBob 3.6s ease-in-out 2.7s infinite; }
      .k-node-box { animation: kNodeGlow 3.2s ease-in-out infinite; }
    </style>
    <linearGradient id="kHubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="55%" stop-color="#2563EB"/><stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="kLineGradL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="kLineGradR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#93C5FD"/><stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <circle cx="220" cy="102" r="82" fill="none" stroke="#DBEAFE" stroke-width="1" stroke-dasharray="3 5"/>
  <circle cx="220" cy="102" r="60" fill="none" stroke="#DBEAFE" stroke-width="1"/>
  <path id="kPathTL" d="M118 46 C168 46, 174 102, 220 102" stroke="#DBEAFE" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path id="kPathBL" d="M118 158 C168 158, 174 102, 220 102" stroke="#DBEAFE" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path id="kPathTR" d="M322 46 C272 46, 266 102, 220 102" stroke="#DBEAFE" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path id="kPathBR" d="M322 158 C272 158, 266 102, 220 102" stroke="#DBEAFE" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path class="k-flow-line" d="M118 46 C168 46, 174 102, 220 102" stroke="url(#kLineGradL)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path class="k-flow-line" d="M118 158 C168 158, 174 102, 220 102" stroke="url(#kLineGradL)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path class="k-flow-line" d="M322 46 C272 46, 266 102, 220 102" stroke="url(#kLineGradR)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path class="k-flow-line-rev" d="M322 158 C272 158, 266 102, 220 102" stroke="url(#kLineGradR)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <g class="k-node-1"><rect class="k-node-box" x="10" y="20" width="110" height="52" rx="12" fill="#fff" stroke="#BFDBFE" stroke-width="1.5"/><circle cx="30" cy="46" r="11" fill="#EFF6FF"/><circle cx="30" cy="43" r="3.5" fill="#2563EB"/><path d="M24 52 C24 48.5, 36 48.5, 36 52" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" fill="none"/><text x="47" y="43" font-size="12" font-weight="700" fill="#102A43">Profiles</text><text x="47" y="56" font-size="9.5" font-weight="500" fill="#5D6B78">48 synced</text><circle cx="118" cy="46" r="4" fill="#3B82F6" stroke="#fff" stroke-width="1.5"/></g>
  <g class="k-node-2"><rect class="k-node-box" x="10" y="132" width="110" height="52" rx="12" fill="#fff" stroke="#BFDBFE" stroke-width="1.5"/><circle cx="30" cy="158" r="11" fill="#EFF6FF"/><circle cx="30" cy="158" r="6" stroke="#2563EB" stroke-width="1.6" fill="none"/><path d="M30 154.5 V158 L32.5 159.5" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" fill="none"/><text x="47" y="155" font-size="12" font-weight="700" fill="#102A43">Attendance</text><text x="47" y="168" font-size="9.5" font-weight="500" fill="#2563EB">Live check-in</text><circle cx="118" cy="158" r="4" fill="#3B82F6" stroke="#fff" stroke-width="1.5"/></g>
  <g class="k-node-3"><rect class="k-node-box" x="320" y="20" width="110" height="52" rx="12" fill="#fff" stroke="#BFDBFE" stroke-width="1.5"/><circle cx="340" cy="46" r="11" fill="#EFF6FF"/><rect x="334.5" y="41" width="11" height="10" rx="2" stroke="#2563EB" stroke-width="1.6" fill="none"/><path d="M337 39.5 V42 M343 39.5 V42" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round"/><text x="357" y="43" font-size="12" font-weight="700" fill="#102A43">Leave</text><text x="357" y="56" font-size="9.5" font-weight="500" fill="#5D6B78">Auto-routed</text><circle cx="322" cy="46" r="4" fill="#3B82F6" stroke="#fff" stroke-width="1.5"/></g>
  <g class="k-node-4"><rect class="k-node-box" x="320" y="132" width="110" height="52" rx="12" fill="#fff" stroke="#BFDBFE" stroke-width="1.5"/><circle cx="340" cy="158" r="11" fill="#EFF6FF"/><path d="M336 158.5 L339 161.5 L344.5 155.5" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="357" y="155" font-size="12" font-weight="700" fill="#102A43">Payroll Prep</text><text x="357" y="168" font-size="9.5" font-weight="500" fill="#2563EB">Ready to run</text><circle cx="322" cy="158" r="4" fill="#3B82F6" stroke="#fff" stroke-width="1.5"/></g>
  <circle class="k-hub-ring" cx="220" cy="102" r="40" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <circle class="k-hub-ring-2" cx="220" cy="102" r="40" fill="none" stroke="#93C5FD" stroke-width="1.5"/>
  <circle cx="220" cy="102" r="45" fill="#DBEAFE" opacity="0.7"/>
  <circle cx="220" cy="102" r="37" fill="url(#kHubGrad)"/>
  <circle cx="220" cy="102" r="33" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="220" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Krewoxa</text>
  <text x="220" y="113" text-anchor="middle" font-size="9.5" font-weight="600" fill="#BFDBFE">HR HUB</text>
</svg>