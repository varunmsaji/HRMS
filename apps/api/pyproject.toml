[project]
name = "hrms"
version = "0.1.0"
description = "HRMS Platform — FastAPI modular monolith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.1.0",
    # RELEASE_HARDENING_PHASE_3B — `core/crypto/field.py`/`core/crypto/master_key.py` import
    # `cryptography.hazmat` directly for AES-256-GCM PII field encryption. Previously present only
    # transitively via `python-jose[cryptography]`; DEP-01 (RELEASE_HARDENING_PHASE_3A) removed
    # that dependency without adding this one explicitly, which a plain `uv sync`/local `.venv`
    # never surfaced (packages already installed stay installed) but a frozen, from-scratch
    # `uv sync --frozen` (a real production Docker build) would not have installed — found via
    # `docker build` actually attempting a cold build; see RELEASE_HARDENING_PHASE_3B_PRODUCTION_
    # INFRASTRUCTURE.md.
    "cryptography>=43.0.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "structlog>=24.4.0",
    "aioboto3>=13.3.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    # RELEASE_HARDENING_PHASE_5A — non-AWS transactional email transport
    # (`docs/audits/RELEASE_HARDENING_PHASE_5A_EMAIL.md`). Async SMTP client, no AWS/vendor ties;
    # replaces `SesEmailSender`'s `aioboto3`-based AWS SES usage as the real email delivery path.
    "aiosmtplib>=3.0.0",
    # Observability: Prometheus-format metrics (docs/architecture/OBSERVABILITY_ARCHITECTURE.md).
    # Pure Python, no agent/daemon; multiprocess mode aggregates gunicorn + Celery workers.
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1.0",
    "pre-commit>=4.0.0",
]
liveness = [
    "opencv-python-headless>=4.10,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrms"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "entrypoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "BLE", "TRY"]
ignore = ["UP046", "TRY003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hrms"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["celery.*", "aioboto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    # The 31-char repository-visible dev JWT secrets (`_DEV_JWT_*_SECRET_DEFAULT`,
    # `core/config/settings.py`) are intentionally short — production secrets are guarded
    # separately by `_guard_non_development_config`'s own 32+-char entropy floor.
    "ignore::jwt.api_jws.InsecureKeyLengthWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1.0",
]
