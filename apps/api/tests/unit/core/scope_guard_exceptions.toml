# Reviewed exceptions for the scope-enforcement guard (tests/unit/core/test_scope_enforcement_guard.py).
# A route that is gated by a permission but never reads the data scope it was granted with must be listed here.
# Kinds:
#   company_level   - the protected resource is not a per-employee record; asserted live that no shipped role holds
#                     the permission below COMPANY.
#   scope_irrelevant- the handler returns no employee data / acts only on the caller's own record (reviewed).
#   known_gap       - employee-targeted handler that ignores scope TODAY; tracked in QA_DEFECT_REGISTER. (The five
#                     OBS-HRA-01 entries were removed in B12 once each handler enforced scope and a regression test
#                     proved it: tests/integration/modules/attendance/test_scope_enforcement_obs_hra01.py.)
#                     Not a justification: the guard pins the list so no NEW gap can appear, and asserts no shipped
#                     role holds the permission below COMPANY. Remove the entry when the handler enforces scope.

[[permission]]
code = "ATTENDANCE.POLICY_MANAGE"
kind = "company_level"
reason = "Company-level resource or action, not a per-employee record; shipped roles hold it at COMPANY only (asserted against a freshly registered tenant by the integration guard). A grant below COMPANY is unsupported until the handler enforces scope."

