name: hrms

# Shared by compreface-admin and compreface-api (both talk to compreface-postgres-db).
x-compreface-db-env: &compreface-db-env
  POSTGRES_USER: compreface
  POSTGRES_PASSWORD: compreface_dev_password
  POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/frs
  SPRING_PROFILES_ACTIVE: dev
  MAX_FILE_SIZE: 5MB
  MAX_REQUEST_SIZE: 10MB

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_dev_password
      POSTGRES_DB: hrms_dev
      # Fixed, repo-visible dev-only value — infra/docker/postgres/init/002_app_role.sh requires
      # this to be set (RELEASE_HARDENING_PHASE_6A / Finding DB-01); production supplies its own,
      # operator-generated value via docker-compose.prod.yml with no default.
      HRMS_APP_PASSWORD: hrms_app_dev_password
    ports:
      # Host port 5433, not 5432 — this machine already runs a system Postgres 14 on 5432 for
      # other projects; this stack must not touch it.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hrms-redis
    restart: unless-stopped
    ports:
      # Host port 6380, not 6379 — this machine already runs a system Redis on 6379 for other
      # projects; this stack must not touch it.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # minio/minio is archived upstream and no longer pullable from any registry (MinIO Inc. ended
    # open-source distribution — see docs/devops/MINIO_IMAGE_REPLACEMENT_AUDIT.md). pgsty/silo is
    # an actively maintained, drop-in-compatible fork (same env vars, same on-disk format,
    # verified in that audit). Dev stays on `latest` for convenience, per the audit's own
    # recommendation; CI and prod pin an explicit release digest instead.
    image: pgsty/silo:latest
    container_name: hrms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hrms_minio
      MINIO_ROOT_PASSWORD: hrms_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # pgsty/silo does not ship mc or curl; port check is sufficient for local dev.
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Upload Security Batch A (docs/audits/UPLOAD_BATCH_A_STORAGE_ARCHITECTURE.md) — creates the
  # `hrms-documents` bucket the API expects (apps/api/.env.example's `S3_BUCKET_DOCUMENTS`) and
  # locks it to no anonymous access, then exits. Previously a manual, undocumented step; both
  # commands are idempotent (`--ignore-existing`, `anonymous set none` is MinIO's already-private
  # default) so re-running this on every `docker compose up` is a no-op once the bucket exists.
  minio-init:
    image: pgsty/mc:latest
    container_name: hrms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hrms_minio hrms_minio_dev_password &&
      mc mb --ignore-existing local/hrms-documents &&
      mc anonymous set none local/hrms-documents
      "
    restart: "no"

  # CompreFace (self-hosted face recognition, apps/api/src/hrms/modules/attendance/
  # compreface_face_provider.py). Opt-in: `docker compose --profile compreface up -d`. The dev API
  # runs on the host, so the front end (admin UI at http://localhost:8090, and the API it proxies
  # under /api/v1) is published on loopback only: COMPREFACE_BASE_URL=http://localhost:8090.
  # `save_images_to_db=false` keeps embeddings only, never the photos. Its own Postgres; nothing
  # here touches the HRMS database.
  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0
    container_name: hrms-compreface-postgres-db
    profiles: [compreface]
    restart: unless-stopped
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface_dev_password
      POSTGRES_DB: frs
    volumes:
      - compreface_data:/var/lib/postgresql/data

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: hrms-compreface-admin
    profiles: [compreface]
    restart: unless-stopped
    environment:
      <<: *compreface-db-env
      ENABLE_EMAIL_SERVER: "false"
      ADMIN_JAVA_OPTS: -Xmx512m
    depends_on: [compreface-postgres-db, compreface-api]

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: hrms-compreface-api
    profiles: [compreface]
    restart: unless-stopped
    environment:
      <<: *compreface-db-env
      API_JAVA_OPTS: -Xmx1g
      SAVE_IMAGES_TO_DB: "false"
      CONNECTION_TIMEOUT: "10000"
      READ_TIMEOUT: "60000"
    depends_on: [compreface-postgres-db]

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: hrms-compreface-core
    profiles: [compreface]
    restart: unless-stopped
    environment:
      ML_PORT: "3000"
      IMG_LENGTH_LIMIT: "640"
      UWSGI_PROCESSES: "2"
      UWSGI_THREADS: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: hrms-compreface-ui
    profiles: [compreface]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      CLIENT_MAX_BODY_SIZE: 10M
      PROXY_READ_TIMEOUT: 60000ms
      PROXY_CONNECT_TIMEOUT: 10000ms
    depends_on: [compreface-api, compreface-admin]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  compreface_data:
