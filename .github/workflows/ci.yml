name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API — lint, typecheck, boundaries, unit, integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # Pinned to UTC deliberately (DEC-TZ-04 / TZ-02). The calculation engine must derive every
    # business date from the WD-06-resolved IANA zone, never from the host clock — running CI in
    # UTC is what makes a regression to `date.today()` fail here instead of passing because the
    # developer's laptop happens to be in IST. `apps/api/Dockerfile` pins the same value.
    env:
      TZ: UTC

    services:
      # Port 5433 (not 5432) and these exact credentials are load-bearing:
      # tests/security/test_rls_runtime_role.py hard-codes both role URLs at localhost:5433,
      # and tests/conftest.py defaults DATABASE_URL to the same. Mapping the service here keeps
      # CI and the docker-compose dev environment identical, so no test file needs a CI-only path.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms_dev_password
          POSTGRES_DB: hrms_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (core package)
        run: uv run mypy src/hrms

      - name: Import boundaries
        run: uv run lint-imports

      # A `services:` container does NOT execute docker-entrypoint-initdb.d, so the init scripts
      # that docker-compose mounts must be applied explicitly here. Order matters: this runs
      # BEFORE alembic so that 002_app_role.sh's ALTER DEFAULT PRIVILEGES is in effect for every
      # table the migrations subsequently create as `hrms`. Reversing the order would leave
      # hrms_app without DML grants on any migrated table, and the RLS tests would then fail for
      # a permissions reason rather than proving anything about row-level security.
      #
      # 002_app_role.sh (RELEASE_HARDENING_PHASE_6A / Finding DB-01) requires HRMS_APP_PASSWORD
      # and calls `psql` itself without -h/-p, so PGHOST/PGPORT/PGPASSWORD are set here instead of
      # passed as flags — the same fixed, repo-visible dev-only value docker-compose.yml uses,
      # matching tests/security/test_rls_runtime_role.py's hardcoded runtime-role URL.
      - name: Apply database init scripts (extensions + hrms_app runtime role)
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGPASSWORD: hrms_dev_password
          POSTGRES_USER: hrms
          POSTGRES_DB: hrms_dev
          HRMS_APP_PASSWORD: hrms_app_dev_password
        run: |
          for f in ../../infra/docker/postgres/init/*.sql; do
            echo "applying $f"
            psql -U hrms -d hrms_dev -v ON_ERROR_STOP=1 -f "$f"
          done
          for f in ../../infra/docker/postgres/init/*.sh; do
            echo "applying $f"
            sh "$f"
          done

      - name: Alembic upgrade head
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql://hrms:hrms_dev_password@localhost:5433/hrms_dev
          REDIS_URL: redis://localhost:6380/0
          JWT_ACCESS_SECRET: ci-test-access-secret-min-16
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-16
        run: uv run alembic upgrade head

      # Cheap, explicit proof that the role the RLS suite depends on was actually provisioned with
      # the attributes that make its assertions meaningful. Without this, a silently missing or
      # mis-created role turns tests/security into a suite that passes vacuously.
      - name: Verify the hrms_app runtime role is NOSUPERUSER / NOBYPASSRLS
        env:
          PGPASSWORD: hrms_dev_password
        run: |
          psql -h localhost -p 5433 -U hrms -d hrms_dev -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN
               IF NOT EXISTS (SELECT 1 FROM pg_roles
                              WHERE rolname='hrms_app' AND NOT rolsuper AND NOT rolbypassrls)
               THEN RAISE EXCEPTION 'hrms_app missing or not NOSUPERUSER/NOBYPASSRLS';
               END IF;
             END \$\$;"

      # Split from the integration/security run so each step name matches what it actually
      # executes (execution gate §18.4 checklist item 9). `pyproject.toml`'s testpaths=["tests"]
      # means a bare `pytest` collects everything, which is why the previous single step named
      # "Unit tests" was misleading about its own coverage.
      - name: Unit tests (no database)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql://hrms:hrms_dev_password@localhost:5433/hrms_dev
          REDIS_URL: redis://localhost:6380/0
          JWT_ACCESS_SECRET: ci-test-access-secret-min-16
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-16
        run: uv run pytest tests/unit --junitxml=test-results/backend-unit.xml

      # DevOps Phase A — several tests/integration files (test_storage.py, employee_import's
      # upload tests, onboarding's document/upload tests) talk to a *real* MinIO over the S3 API,
      # no mocking, the same convention this repo already uses for Postgres/Redis. Until now CI
      # never provided one: these env vars were simply unset, so `Settings.s3_endpoint_url` stayed
      # None and any test that actually opened the S3 client either errored or (worse) tried to
      # resolve real AWS S3. The two steps below start a disposable MinIO — same credentials, same
      # bucket name as docker-compose.yml's `minio`/`minio-init` services, for the same "no
      # CI-only path" reason the Postgres/Redis services above give — and provision its bucket
      # exactly the way `minio-init`'s entrypoint does, before any test can reach it.
      #
      # minio/minio is archived upstream and no longer pullable from any registry (MinIO Inc.
      # ended open-source distribution). pgsty/silo is the durable, drop-in-compatible fork
      # adopted repo-wide after docs/devops/MINIO_IMAGE_REPLACEMENT_AUDIT.md — same image used by
      # docker-compose.yml/.prod.yml now, restoring the "no CI-only path" invariant this file's
      # other services already follow. Pinned by digest, matching docker-compose.prod.yml, so CI
      # is testing the same bits production runs, not just an equivalent-looking fork.
      # Explicit `server /data ...` command required: unlike the old bitnamilegacy stop-gap image
      # (whose own default CMD ran `minio server` automatically), pgsty/silo's default CMD is a
      # bare `silo` with no subcommand, which just prints top-level help and exits — matching
      # docker-compose.yml's explicit `command:` for the same image.
      - name: Start MinIO (disposable, test-only — mirrors docker-compose.yml's `minio` service)
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=hrms_minio \
            -e MINIO_ROOT_PASSWORD=hrms_minio_dev_password \
            pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data --console-address ":9001"

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy within 30s" >&2
          docker logs ci-minio || true
          exit 1

      # pgsty/mc, pinned to match docker-compose.prod.yml's `minio-init` image (see note above).
      #
      # Retry loop: a real run (2026-09-28, run 36368896052) hit "connection reset by peer" on the
      # very first `mc alias set` immediately after "Wait for MinIO" reported /minio/health/live
      # healthy — not reproduced across several local repeats, so treated as a startup race (the
      # health endpoint and the S3 API are the same port/process, but evidently can have a brief
      # window where one answers before the other is fully stable) rather than a config bug. A
      # short retry is the standard, minimal fix for exactly this kind of transient timing race.
      - name: Create MinIO test bucket (mirrors docker-compose.yml's `minio-init` service)
        run: |
          for i in $(seq 1 10); do
            docker run --rm --network host --entrypoint /bin/sh pgsty/mc@sha256:8ac3333f012adb27c406df77c7cae6ce700892cc44ee489036404e3fc356e9ea -c "
              mc alias set local http://localhost:9000 hrms_minio hrms_minio_dev_password &&
              mc mb --ignore-existing local/hrms-documents &&
              mc anonymous set none local/hrms-documents
            " && exit 0
            echo "mc setup failed (attempt $i/10), retrying..." >&2
            sleep 2
          done
          echo "mc setup did not succeed after 10 attempts" >&2
          exit 1

      # DATABASE_URL points at `hrms`, the schema owner — deliberately, and contrary to the
      # execution gate's §18.4 checklist item 3. See the "CI" section of
      # docs/audits/ATTENDANCE_TIMEZONE_IMPLEMENTATION_COMPLETION_REPORT.md for the measurement:
      # pointing the default session at hrms_app produces 130 errors across tests/integration,
      # because dozens of fixture setup/teardown helpers perform raw cross-tenant DELETE/INSERT
      # with no RLS GUC set and rely on BYPASSRLS to do it.
      #
      # RLS is nonetheless a real gate here, because tests/security/test_rls_runtime_role.py does
      # not read this variable: it repoints the app engine at hrms_app for the duration of each
      # test, and additionally opens its own raw hrms_app engine to prove that the DATABASE — not
      # application WHERE-clauses — blocks cross-tenant SELECT/INSERT/UPDATE/DELETE.
      #
      # AWS_REGION/S3_BUCKET_DOCUMENTS/S3_ENDPOINT_URL/AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
      # match apps/api/.env.example's local-dev MinIO block exactly (DevOps Phase A) — same reason
      # the Postgres/Redis credentials above are the repo-visible dev ones, not real secrets.
      - name: Integration + security tests (database + MinIO required)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql://hrms:hrms_dev_password@localhost:5433/hrms_dev
          REDIS_URL: redis://localhost:6380/0
          JWT_ACCESS_SECRET: ci-test-access-secret-min-16
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-16
          AWS_REGION: ap-south-1
          S3_BUCKET_DOCUMENTS: hrms-documents
          S3_ENDPOINT_URL: http://localhost:9000
          AWS_ACCESS_KEY_ID: hrms_minio
          AWS_SECRET_ACCESS_KEY: hrms_minio_dev_password
        run: uv run pytest tests/integration tests/security --junitxml=test-results/backend-integration-security.xml

      - name: Stop MinIO
        if: always()
        run: docker rm -f ci-minio || true

      # continue-on-error: confirmed via a real run (2026-09-28,
      # https://github.com/varunmsaji/HRMS/actions/runs/36367824434) that this account's
      # GitHub Actions artifact storage quota is account-wide (this repo has 0 artifacts of its
      # own — `gh api /repos/.../actions/artifacts` confirms it), so a step that only *reports*
      # test results must not fail a job whose actual tests passed. A billing/plan-level
      # constraint, not something a workflow change can fix.
      - name: Upload backend test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/api/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "### Backend — API job" >> "$GITHUB_STEP_SUMMARY"
          echo "Ruff, Ruff-format, mypy, import-linter, unit tests, integration+security tests (real Postgres + Redis + MinIO, fresh every run)." >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web — lint, typecheck, vitest, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    # Non-IST on purpose: the Phase 6 timezone tests assert that an attendance instant renders as
    # IST regardless of the viewer's zone. Running this job in UTC would let a regression that
    # falls back to the host timezone slip through on values that happen to look close enough.
    env:
      TZ: America/New_York
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # DevOps Phase A — `apps/web` had no ESLint configuration or dependency at all (that is what
      # made `npm run lint` / `next lint` hang on an interactive setup prompt in CI). `eslint` +
      # `eslint-config-next` (pinned to this repo's exact Next version) plus the original
      # `.eslintrc.json` fixed that: `next lint` was genuinely non-interactive.
      #
      # FINDING-02 (pre-Payroll remediation, 2026-10-05) — `next lint` was removed entirely in
      # Next 16 (the version this step's dependency bump requires, closing the critical Next.js
      # CVE + the high-severity PostCSS one bundled inside it); `eslint-config-next@16` ships only
      # a flat config, so this now runs the `eslint` CLI directly against `eslint.config.mjs`
      # (`.eslintrc.json` removed). The same bump's `eslint-plugin-react-hooks@7` also added a new,
      # broadly-applicable `react-hooks/set-state-in-effect` rule that fires on this codebase's
      # very common "fetch in `useEffect`, `setState` on completion" pattern — the backlog this
      # step surfaces jumped from 7 pre-existing violations to ~108 as a direct, visible
      # consequence of that rule, not a regression introduced by this change.
      #
      # Deliberately NOT a blocking gate yet, for that original reason and now this new one:
      # fixing either backlog is real frontend code modification outside a dependency-CVE
      # remediation's scope (see docs/devops/PHASE_A_CI_IMPLEMENTATION.md §5 and
      # docs/audits/PRE_PAYROLL_PRODUCTION_READINESS_FINAL_AUDIT.md's FINDING-02 remediation
      # section) — `continue-on-error` is used here openly, as a documented policy, not to hide a
      # required check: A12 does not list lint in the set of checks that must fail CI. The step's
      # output is still fully visible in the log either way. Promote to blocking once a backlog
      # pass addresses both.
      - name: ESLint (non-blocking — see step comment)
        continue-on-error: true
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/frontend-vitest.xml

      # DevOps Phase A — CI never actually built the frontend for production before; only the
      # local `run_full_tests.py` did. ESLint findings are kept out of this step's pass/fail
      # meaning (see the ESLint step comment above for why).
      #
      # FINDING-02 — `--webpack` is explicit, not incidental: Next 16 defaults `next build` to
      # Turbopack, which fails this app with `Invariant: no direct app page entry found for
      # /_not-found` (reproduced locally; not investigated further as a Turbopack bug report,
      # since webpack already builds this app's exact pre-upgrade route set — 70 routes — cleanly
      # and is this project's proven, tested bundler). `package.json`'s `build`/`dev` scripts carry
      # the same flag for the same reason.
      - name: Production build
        run: npx next build --webpack

      # continue-on-error: same account-wide artifact storage quota finding as the backend
      # upload step above — reporting must not fail a job whose actual checks passed.
      - name: Upload frontend test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports
          path: apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          echo "### Frontend — Web job" >> "$GITHUB_STEP_SUMMARY"
          echo "ESLint (non-blocking, see workflow comment), TypeScript, Vitest, production build." >> "$GITHUB_STEP_SUMMARY"

  mobile:
    # Mission Phase 14 — the Flutter suite (including the API error-handling, timeout and
    # diagnostics tests) was never run in CI. `test/live` is opt-in and skips without its env.
    name: Mobile — analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

  security-scan:
    name: Security — secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DevOps Phase A — A7. Real, blocking gate: unlike the lint/dependency-scan jobs, a detected
      # secret must fail the build, no continue-on-error. `--redact` (per A7's own instruction)
      # keeps the actual secret value out of the CI log even when a real one is found.
      #
      # `--no-git`, deliberately: `gitleaks detect` on a git checkout defaults to walking the
      # *entire commit history* every single run, which would re-flag the same already-reviewed
      # history on every future PR (and get slower as the repo grows) instead of checking "is
      # there a secret in the code as it would be if this merges" — the question this gate is
      # actually meant to answer. The full-history scan was run once, by hand, as part of the
      # Phase 0 pre-push audit (docs/devops/PHASE_A_CI_IMPLEMENTATION.md §Secret scanning) before
      # anything was pushed; this job checks the ongoing, per-PR case.
      #
      # `.gitleaks.toml` (new, repo root) narrowly excludes build/tool-cache paths (never present
      # in this job's checkout anyway) and one hand-verified false positive in a planning doc —
      # see that file's own comments for exactly what and why.
      - name: Gitleaks (secret scanning)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --no-banner --redact \
            --config=/repo/.gitleaks.toml

      - name: Job summary
        if: always()
        run: |
          echo "### Security — secret scanning" >> "$GITHUB_STEP_SUMMARY"
          echo "Gitleaks scanned the checked-out tree. Blocking: a real detected secret fails this job." >> "$GITHUB_STEP_SUMMARY"

  dependency-scan:
    name: Security — dependency vulnerability scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-path: apps/api/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # DevOps Phase A — A8. pip-audit is run via `uvx` (ephemeral) rather than added as a project
      # dev-dependency, so it never touches uv.lock.
      #
      # FINDING-02 / P2-01 (pre-Payroll remediation, 2026-10-05) — promoted to blocking. The one
      # finding this scan had (urllib3 2.7.0, 3 known CVEs, PYSEC-2026-4175/4176/4177) is fixed
      # (urllib3 2.8.0, `uv.lock`); this is now the required regression gate the audit's §20 asked
      # for ("fail the build on any new critical/high production-dependency vulnerability"), not
      # just a visibility step.
      - name: pip-audit (Python dependencies)
        working-directory: apps/api
        run: |
          uv export --no-hashes --no-emit-project -o /tmp/requirements-audit.txt
          uvx pip-audit -r /tmp/requirements-audit.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # FINDING-02 (pre-Payroll remediation, 2026-10-05) — promoted to blocking, `--omit=dev`.
      # The critical Next.js advisory (DoS/HTTP request smuggling) and the high-severity PostCSS
      # one bundled inside it are fixed (next 14.2.35 -> 16.3.8; see FINDING-02's remediation
      # section in docs/audits/PRE_PAYROLL_PRODUCTION_READINESS_FINAL_AUDIT.md for why a direct
      # 14->15 patch could not close the PostCSS advisory — Next only bumped its own bundled
      # PostCSS past the vulnerable range at 16.3.0). `--omit=dev` scopes this to the production
      # bundle specifically: a handful of moderate/high advisories remain in devDependencies only
      # (P3-05, unchanged, not in anything served to a user) and are deliberately not this gate's
      # concern — `npm audit` (no `--omit=dev`) still runs informationally in the job summary
      # below if you need the full picture.
      - name: npm audit (frontend production dependencies)
        working-directory: apps/web
        run: npm ci && npm audit --omit=dev --audit-level=high

      - name: Job summary
        if: always()
        run: |
          echo "### Security — dependency vulnerability scanning" >> "$GITHUB_STEP_SUMMARY"
          echo "pip-audit (Python) + npm audit --omit=dev (frontend production deps) — both blocking as of the FINDING-02/P2-01 remediation. devDependency-only advisories are tracked separately (P3-05) and do not gate this job." >> "$GITHUB_STEP_SUMMARY"
